<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teaching Word Cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero-card">
        <div class="hero-header">
          <p class="eyebrow">Live Classroom Feedback</p>
          <h1>教學文字雲</h1>
          <p id="db-status" class="status-text">資料庫狀態：尚未連線</p>
        </div>
        <aside class="qr-card" aria-label="學生連線 QR code">
          <img id="class-qr" alt="學生連線 QR code" />
        </aside>
        <div class="response-card">
          <label class="panel-title" for="response-text">你的回覆</label>
          <textarea id="response-text" spellcheck="false" maxlength="300" placeholder="請輸入這題的想法或關鍵字"></textarea>
          <div class="response-actions">
            <p class="hint">每次送出最多 300 字。</p>
            <button id="submit-response" class="primary-button" type="button">送出回覆</button>
          </div>
        </div>
      </section>

      <section class="panel cloud-panel">
        <div class="panel-header">
          <p class="panel-title">文字雲預覽</p>
          <p class="summary-text">依詞頻自動調整大小與位置</p>
        </div>
        <div id="cloud" class="cloud-canvas" aria-live="polite"></div>
      </section>

      <section class="lower-grid">
        <div class="panel feedback-panel">
          <div class="panel-header">
            <p class="panel-title">即時回覆</p>
            <p id="response-count" class="summary-text">0 則</p>
          </div>
          <ul id="response-list" class="response-list"></ul>
        </div>
        <div class="panel insight-panel">
          <div class="panel-header">
            <p class="panel-title">詞頻摘要</p>
            <p id="summary" class="summary-text">尚未分析</p>
          </div>
          <ol id="top-words" class="top-words"></ol>
        </div>
      </section>

      <section class="footer-panel">
        <button id="clear-round" class="danger-button" type="button">清空本輪</button>
        <div class="designer-credit">
          設計者：
          <a href="https://594katchang-source.github.io/" rel="noopener noreferrer">Kat Chang 張雁雲營養師</a>
        </div>
      </section>
    </main>

    <script src="/firebase-config.js"></script>
    <script type="module" src="/app.js?v=20260705c"></script>
  </body>
</html>
