<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teaching Word Cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero-card">
        <p class="eyebrow">Firebase Hosting Demo</p>
        <h1>教學文字雲</h1>
        <p class="intro">
          把一段課堂重點、學生回饋、標籤詞或會議筆記貼進來，系統會自動計次，立刻排出一張可看的文字雲。
        </p>
        <div class="hero-actions">
          <button id="load-demo" class="secondary-button" type="button">載入示範文字</button>
          <button id="render-cloud" class="primary-button" type="button">產生文字雲</button>
          <button id="save-firestore" class="secondary-button" type="button">存到 Firestore</button>
          <button id="read-firestore" class="secondary-button" type="button">讀取 Firestore</button>
        </div>
        <p id="db-status" class="status-text">資料庫狀態：尚未測試</p>
      </section>

      <section class="workspace-grid">
        <div class="panel editor-panel">
          <label class="panel-title" for="source-text">文字來源</label>
          <textarea id="source-text" spellcheck="false"></textarea>
          <p class="hint">
            可直接貼中文句子、英文關鍵字，或用逗號、空白、換行分隔。
          </p>
        </div>

        <div class="panel insight-panel">
          <div class="panel-header">
            <p class="panel-title">詞頻摘要</p>
            <p id="summary" class="summary-text">尚未分析</p>
          </div>
          <ol id="top-words" class="top-words"></ol>
        </div>
      </section>

      <section class="panel cloud-panel">
        <div class="panel-header">
          <p class="panel-title">文字雲預覽</p>
          <p class="summary-text">依詞頻自動調整大小與位置</p>
        </div>
        <div id="cloud" class="cloud-canvas" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="/app.js?v=20260622b"></script>
  </body>
</html>
